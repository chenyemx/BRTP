name: CPU software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check maintained source style
        run: |
          python -m ruff check brtp tests train.py
          python -m ruff format --check brtp tests train.py
      - name: Check command interface
        run: |
          python train.py --help
          python train.py list
      - name: Run software regression tests
        run: python -m unittest discover -s tests -v
